{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow p-4 text-center">
            <h3 class="mb-3">Eliminar Producto</h3>
            <p>¿Estás seguro de que deseas eliminar el producto <strong>{{ producto.nombre }}</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger w-100 mb-2">Sí, eliminar</button>
                <a href="{% url 'lista_productos' %}" class="btn btn-secondary w-100">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
