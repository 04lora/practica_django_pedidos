{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4">
            <h3 class="mb-3">{{ titulo }}</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-dark w-100">Guardar</button>
            </form>
            <a href="{% url 'lista_productos' %}" class="btn btn-link text-muted mt-2 text-center">Volver</a>
        </div>
    </div>
</div>
{% endblock %}
