<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4" style="width: 400px;">
        <h3 class="text-center mb-4">Pedidos</h3>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="mb-3">
                <label for="id_username" class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" required id="id_username">
            </div>
            <div class="mb-3">
                <label for="id_password" class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required id="id_password">
            </div>
            <button type="submit" class="btn btn-dark w-100 mb-3">Ingresar</button>
        </form>

        <div class="text-center">
            <p class="mb-0 text-muted" style="font-size: 0.9rem;">
                ¿No tienes una cuenta? <a href="{% url 'registro' %}" class="text-decoration-none">Regístrate aquí</a>
            </p>
        </div>
    </div>
</body>
</html>
