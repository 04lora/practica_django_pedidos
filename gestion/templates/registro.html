<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Oculta los textos de ayuda predeterminados y listas de Django */
        .form-text, ul.help-text, ul {
            display: none;
        }
    </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4" style="width: 400px;">
        <h3 class="text-center mb-4">Registro</h3>

        {% if form.errors %}
            <div class="alert alert-danger p-2 small">
                Por favor, verifica los datos ingresados.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="id_username" class="form-label">Nombre de usuario</label>
                <input type="text" name="username" class="form-control" required id="id_username" placeholder="Tu usuario">
            </div>

            <div class="mb-3">
                <label for="id_password1" class="form-label">Contraseña</label>
                <input type="password" name="password1" class="form-control" required id="id_password1" placeholder="Tu contraseña">
            </div>

            <div class="mb-3">
                <label for="id_password2" class="form-label">Confirmar contraseña</label>
                <input type="password" name="password2" class="form-control" required id="id_password2" placeholder="Repite tu contraseña">
            </div>

            <button type="submit" class="btn btn-dark w-100 mb-3">Registrarse</button>
        </form>

        <div class="text-center">
            <p class="mb-0 text-muted" style="font-size: 0.9rem;">
                ¿Ya tienes una cuenta? <a href="{% url 'login' %}" class="text-decoration-none">Inicia sesión aquí</a>
            </p>
        </div>
    </div>
</body>
</html>
